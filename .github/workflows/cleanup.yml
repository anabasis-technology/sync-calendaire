name: Nettoyage ponctuel FreeLance (temporaire)

on:
  workflow_dispatch:
    inputs:
      execute:
        description: "true = exécuter ; sinon essai à blanc"
        default: "false"
      archive_notion:
        description: "true = archiver les pages Notion ciblées (avec execute)"
        default: "false"
      diag:
        description: "true = diagnostic de lecture seule"
        default: "false"

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node cleanup-freelance-imports.js
        env:
          EXECUTE: ${{ inputs.execute }}
          DIAG: ${{ inputs.diag }}
          ARCHIVE_NOTION: ${{ inputs.archive_notion }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          TICKTICK_TOKEN: ${{ secrets.TICKTICK_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
