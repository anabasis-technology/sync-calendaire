name: Sync TickTick -> Notion

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node sync.js
        env:
          TICKTICK_TOKEN: ${{ secrets.TICKTICK_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
