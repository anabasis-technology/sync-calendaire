name: Sync TickTick -> Notion

on:
  # Cron natif GitHub retiré le 29/09/2026 : peu fiable (voir README), il
  # échouait périodiquement et spammait des mails d'échec sans que le sync
  # en dépende réellement. Le déclenchement toutes les 5 min se fait
  # désormais via un cron externe gratuit (cron-job.org) qui appelle
  # workflow_dispatch — zéro coût, zéro dépendance changée, juste moins
  # de bruit.
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node sync.js
        env:
          TICKTICK_TOKEN: ${{ secrets.TICKTICK_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
